# Keeps the free Render instance awake so the first message after a quiet spell
# doesn't wait for a cold start (free instances sleep after 15 minutes without
# traffic and take up to a minute to wake). One instance running all month stays
# within Render's 750 free hours. /health touches neither Firestore nor the AI API.
# Delete this file to let the service sleep again.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 https://askphilo.kro.kr/health > /dev/null
