# Render Blueprint — https://render.com/docs/blueprint-spec
# Secrets are NOT stored here:
#   * ANTHROPIC_API_KEY: prompted once when the Blueprint is created (sync: false)
#   * Firebase service account: upload as a Secret File named
#     firebase-service-account.json (Dashboard → Environment → Secret Files)
services:
  - type: web
    name: askphilo
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    domains:
      - askphilo.kro.kr
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: AskPhilo
      - key: APP_URL
        value: https://askphilo.kro.kr
      - key: SECRET_KEY
        generateValue: true
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase-service-account.json
      # Production runs on the real API. Sonnet 5.5 was chosen after live
      # evaluations on 2026-10-14: it followed the counselling rules while Haiku
      # 5.5 often named the philosopher and ran long; ~$0.004 per reply.
      # Set AI_MODE to mock here to stop all API calls.
      - key: AI_MODE
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: CONTROLLER_VERSION
        value: v1
      - key: MAX_CONTEXT_MESSAGES
        value: "10"
      - key: MAX_OUTPUT_TOKENS
        value: "300"
      - key: SOFT_CONVERSATION_MESSAGE_LIMIT
        value: "150"
      - key: HARD_CONVERSATION_MESSAGE_LIMIT
        value: "300"
      - key: CONTEXT_SUMMARY_TRIGGER_MESSAGES
        value: "20"
      # Replaces Render's default (which adds --preload); settings live in gunicorn.conf.py
      - key: GUNICORN_CMD_ARGS
        value: "--access-logfile -"
