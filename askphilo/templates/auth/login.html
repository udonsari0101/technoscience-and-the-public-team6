{% extends "base.html" %}
{% from "_macros.html" import back_link, icon %}
{% block title %}로그인 · AskPhilo{% endblock %}
{% block body %}
<header class="topbar">
  {{ back_link(url_for('main.index'), '처음으로') }}
</header>
<main id="main" class="page page-enter form-page">
  <h1 class="page-title">다시 만나서 반가워요</h1>
  <form class="form" method="post" action="{{ url_for('auth.login') }}" novalidate data-submit-once>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <div class="field">
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" value="{{ username }}" maxlength="20" autocomplete="username"
        autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <div class="password-wrap">
        <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
        <button type="button" class="icon-btn reveal" data-reveal="password" aria-label="비밀번호 보기" aria-pressed="false">{{ icon('eye') }}</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block form-submit" type="submit">로그인</button>
  </form>
  <p class="muted center">처음이신가요? <a href="{{ url_for('auth.signup') }}">회원가입</a></p>
</main>
{% endblock %}
